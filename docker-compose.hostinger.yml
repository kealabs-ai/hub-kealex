version: '3.8'

networks:
  kealex-network:
    driver: bridge

services:
  # API Gateway
  api-gateway:
    image: nginx:alpine
    container_name: kealex-api-gateway
    ports:
      - "8000:80"
    depends_on:
      - hubkealex
      - svc-activities
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kealex-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # API principal: mantém auth, prazos, processos e demais endpoints existentes.
  hubkealex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kealex-hubkealex
    environment:
      - KEALEX_SECRET_KEY=${KEALEX_SECRET_KEY:-${KEALEX_JWT_SECRET}}
      - KEALEX_JWT_SECRET=${KEALEX_JWT_SECRET:-${KEALEX_SECRET_KEY}}
      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT:-3306}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}
      - KEALEX_CORS_ALLOWED_ORIGINS=${KEALEX_CORS_ALLOWED_ORIGINS:-*}
      - KEALEX_ASAAS_API_KEY=${KEALEX_ASAAS_API_KEY:-}
      - KEALEX_ASAAS_BASE_URL=${KEALEX_ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
      - KEALEX_ASAAS_WEBHOOK_TOKEN=${KEALEX_ASAAS_WEBHOOK_TOKEN:-}
    networks:
      - kealex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/k1/lex/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Microservices
  svc-auth:
    build: ./svc-auth
    container_name: kealex-svc-auth
    environment:
      - KEALEX_SECRET_KEY=${KEALEX_SECRET_KEY}
      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}
      - KEALEX_ASAAS_API_KEY=${KEALEX_ASAAS_API_KEY:-}
      - KEALEX_ASAAS_BASE_URL=${KEALEX_ASAAS_BASE_URL}
      - KEALEX_ASAAS_WEBHOOK_TOKEN=${KEALEX_ASAAS_WEBHOOK_TOKEN:-}
    networks:
      - kealex-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  svc-processos:
    build: ./svc-processos
    container_name: kealex-svc-processos
    environment:
      - KEALEX_SECRET_KEY=${KEALEX_SECRET_KEY}
      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}
      - KEALEX_CORS_ALLOWED_ORIGINS=${KEALEX_CORS_ALLOWED_ORIGINS:-*}
    networks:

      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}

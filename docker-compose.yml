version: '3.8'

services:

  # ── HUBKEALEX ──────────────────────────────────────────────────────────
  hubkealex:
    build: .
    container_name: hubkealex
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=srv1078.hstgr.io
      - DB_PORT=3306
      - DB_NAME=u549746795_kealex
      - DB_USER=u549746795_kealex
      - DB_PASSWORD=Sally2026%40%21%40
      - JWT_SECRET=your-super-secret-jwt-key
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hubkealex.rule=Host(`srv1023256.hstgr.cloud`) || Host(`kealabs.cloud`) || Host(`www.kealabs.cloud`)"
      - "traefik.http.routers.hubkealex.entrypoints=https"
      - "traefik.http.routers.hubkealex.tls=true"
      - "traefik.http.routers.hubkealex.middlewares=hubkealex-cors,hubkealex-compress"
      - "traefik.http.middlewares.hubkealex-cors.headers.accesscontrolalloworiginlist=https://darkorange-raven-554257.hostingersite.com,https://kealabs.cloud,https://www.kealabs.cloud,https://kealabs.com.br,https://www.kealabs.com.br,https://kealex.com.br,https://www.kealex.com.br"
      - "traefik.http.middlewares.hubkealex-cors.headers.accesscontrolallowmethods=GET,POST,OPTIONS"
      - "traefik.http.middlewares.hubkealex-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.hubkealex-cors.headers.accesscontrolmaxage=3600"
      - "traefik.http.middlewares.hubkealex-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.middlewares.hubkealex-cors.headers.addvaryheader=true"
      - "traefik.http.middlewares.hubkealex-compress.compress=true"
      - "traefik.http.services.hubkealex.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/k1/lex/health', timeout=5)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - kealabs-net
      - easypanel

  # ── SVC-COBRANCAS ──────────────────────────────────────────────────────
  # Authentication and billing API
  kealex-svc-auth:
    build: ./svc-auth
    image: kealex/svc-auth:latest
    environment:
      - SECRET_KEY=${SECRET_KEY:-${JWT_SECRET}}
      - DATABASE_URL=${DATABASE_URL:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.kealex-auth.rule=(Host(`srv1023256.hstgr.cloud`) || Host(`kealex.com.br`) || Host(`www.kealex.com.br`)) && PathPrefix(`/v1/lex/auth`)"
      - "traefik.http.routers.kealex-auth.entrypoints=https"
      - "traefik.http.routers.kealex-auth.tls=true"
      - "traefik.http.routers.kealex-auth.service=kealex-auth"
      - "traefik.http.services.kealex-auth.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.kealex-auth-strip.stripprefix.prefixes=/v1/lex"
      - "traefik.http.middlewares.kealex-cors.headers.accesscontrolalloworiginlist=https://kealex.com.br,https://www.kealex.com.br,https://srv1023256.hstgr.cloud"
      - "traefik.http.middlewares.kealex-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.kealex-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.kealex-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.routers.kealex-auth.middlewares=kealex-auth-strip,kealex-cors"
      - "traefik.http.routers.kealex-auth.priority=100"
      - "traefik.http.routers.kealex-auth-k1.rule=(Host(`srv1023256.hstgr.cloud`) || Host(`kealex.com.br`) || Host(`www.kealex.com.br`)) && PathPrefix(`/k1/lex/auth`)"
      - "traefik.http.routers.kealex-auth-k1.entrypoints=https"
      - "traefik.http.routers.kealex-auth-k1.tls=true"
      - "traefik.http.routers.kealex-auth-k1.service=kealex-auth"
      - "traefik.http.routers.kealex-auth-k1.middlewares=kealex-cors"
      - "traefik.http.routers.kealex-auth-k1.priority=101"
    networks:
      - easypanel
      - kealex-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  kealex-svc-usuarios:
    build: ./svc-usuarios
    image: kealex/svc-usuarios:latest
    environment:
      - SECRET_KEY=${SECRET_KEY:-${JWT_SECRET}}
      - DATABASE_URL=${DATABASE_URL:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.kealex-usuarios.rule=(Host(`srv1023256.hstgr.cloud`) || Host(`kealex.com.br`) || Host(`www.kealex.com.br`)) && PathPrefix(`/v1/lex/usuarios`)"
      - "traefik.http.routers.kealex-usuarios.entrypoints=https"
      - "traefik.http.routers.kealex-usuarios.tls=true"
      - "traefik.http.routers.kealex-usuarios.service=kealex-usuarios"
      - "traefik.http.services.kealex-usuarios.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.kealex-usuarios-cors.headers.accesscontrolalloworiginlist=https://kealex.com.br,https://www.kealex.com.br,https://srv1023256.hstgr.cloud"
      - "traefik.http.middlewares.kealex-usuarios-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.kealex-usuarios-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.kealex-usuarios-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.routers.kealex-usuarios.middlewares=kealex-usuarios-cors"
      - "traefik.http.routers.kealex-usuarios.priority=110"
    networks:
      - easypanel
      - kealex-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  kealex-svc-escritorios:
    build: ./svc-escritorios
    image: kealex/svc-escritorios:latest
    environment:
      - SECRET_KEY=${SECRET_KEY:-${JWT_SECRET}}
      - DATABASE_URL=${DATABASE_URL:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.kealex-escritorios.rule=(Host(`srv1023256.hstgr.cloud`) || Host(`kealex.com.br`) || Host(`www.kealex.com.br`)) && PathPrefix(`/v1/lex/escritorios`)"
      - "traefik.http.routers.kealex-escritorios.entrypoints=https"
      - "traefik.http.routers.kealex-escritorios.tls=true"
      - "traefik.http.routers.kealex-escritorios.service=kealex-escritorios"
      - "traefik.http.services.kealex-escritorios.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.kealex-escritorios-cors.headers.accesscontrolalloworiginlist=https://kealex.com.br,https://www.kealex.com.br,https://srv1023256.hstgr.cloud"
      - "traefik.http.middlewares.kealex-escritorios-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.kealex-escritorios-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.kealex-escritorios-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.routers.kealex-escritorios.middlewares=kealex-escritorios-cors"
      - "traefik.http.routers.kealex-escritorios.priority=110"
    networks:
      - easypanel
      - kealex-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  svc-cobrancas:
    build: ./svc-cobrancas
    container_name: svc-cobrancas
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://u549746795_kealex:Sally2026%40%21%40@srv1078.hstgr.io:3306/u549746795_kealex
      - SECRET_KEY=your-super-secret-jwt-key
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.svc-cobrancas.rule=(Host(`srv1023256.hstgr.cloud`) || Host(`kealabs.cloud`) || Host(`www.kealabs.cloud`)) && (PathPrefix(`/v1/lex/cobrancas`) || PathPrefix(`/k1/lex/cobrancas`))"
      - "traefik.http.routers.svc-cobrancas.entrypoints=https"
      - "traefik.http.routers.svc-cobrancas.tls=true"
      - "traefik.http.routers.svc-cobrancas.priority=10"
      - "traefik.http.routers.svc-cobrancas.middlewares=svc-cobrancas-cors,svc-cobrancas-compress,svc-cobrancas-strip"
      - "traefik.http.middlewares.svc-cobrancas-strip.stripprefix.prefixes=/v1/lex,/k1/lex"
      - "traefik.http.middlewares.svc-cobrancas-cors.headers.accesscontrolalloworiginlist=https://darkorange-raven-554257.hostingersite.com,https://kealabs.cloud,https://www.kealabs.cloud,https://kealabs.com.br,https://www.kealabs.com.br,https://kealex.com.br,https://www.kealex.com.br"
      - "traefik.http.middlewares.svc-cobrancas-cors.headers.accesscontrolallowmethods=GET,POST,OPTIONS"
      - "traefik.http.middlewares.svc-cobrancas-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.svc-cobrancas-cors.headers.accesscontrolmaxage=3600"
      - "traefik.http.middlewares.svc-cobrancas-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.middlewares.svc-cobrancas-cors.headers.addvaryheader=true"
      - "traefik.http.middlewares.svc-cobrancas-compress.compress=true"
      - "traefik.http.services.svc-cobrancas.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - kealabs-net
      - easypanel

networks:
  kealabs-net:
    external: true
  easypanel:
    external: true
  kealex-internal:
    driver: bridge
    internal: false

services:
  # Nginx API Gateway
  nginx-gateway:
    build: ./nginx
    container_name: kealex-nginx-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      svc-auth:
        condition: service_healthy
      svc-processos:
        condition: service_healthy
      svc-documentos:
        condition: service_healthy
      svc-integracoes:
        condition: service_healthy
      svc-financeiro:
        condition: service_healthy
      svc-prazos:
        condition: service_healthy
      svc-usuarios:
        condition: service_healthy
      svc-configuracoes:
        condition: service_healthy
      svc-escritorios:
        condition: service_healthy
      svc-clientes:
        condition: service_healthy
    networks:
      - kealex-network
    restart: unless-stopped

  # Microservices
  svc-auth:
    build: ./svc-auth
    container_name: kealex-svc-auth
    environment:
      - KEALEX_SECRET_KEY=${KEALEX_SECRET_KEY}
      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}
      - KEALEX_ASAAS_API_KEY=${KEALEX_ASAAS_API_KEY:-}
      - KEALEX_ASAAS_BASE_URL=${KEALEX_ASAAS_BASE_URL}
      - KEALEX_ASAAS_WEBHOOK_TOKEN=${KEALEX_ASAAS_WEBHOOK_TOKEN:-}
    networks:
      - kealex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  svc-processos:
    build: ./svc-processos
    container_name: kealex-svc-processos
    environment:
      - KEALEX_SECRET_KEY=${KEALEX_SECRET_KEY}
      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}
    networks:
      - kealex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  svc-documentos:
    build: ./svc-documentos
    container_name: kealex-svc-documentos
    environment:
      - KEALEX_SECRET_KEY=${KEALEX_SECRET_KEY}
      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}
    networks:
      - kealex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  svc-integracoes:
    build: ./svc-integracoes
    container_name: kealex-svc-integracoes
    environment:
      - KEALEX_SECRET_KEY=${KEALEX_SECRET_KEY:-${KEALEX_JWT_SECRET}}
      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT:-3306}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}
      - FISCALAPI_ENABLED=${FISCALAPI_ENABLED:-false}
      - ESCAVADOR_API_ENABLED=${ESCAVADOR_API_ENABLED:-false}
      - ESCAVADOR_API_TOKEN=${ESCAVADOR_API_TOKEN:-}
      - ESCAVADOR_API_TIMEOUT=${ESCAVADOR_API_TIMEOUT:-30}
      - FISCALAPI_BASE_URL=${FISCALAPI_BASE_URL:-https://api.fiscalapi.com.br}
      - FISCALAPI_API_KEY=${FISCALAPI_API_KEY:-}
      - FISCALAPI_TIMEOUT=${FISCALAPI_TIMEOUT:-75}
      - FISCALAPI_RATE_LIMIT_PER_MINUTE=${FISCALAPI_RATE_LIMIT_PER_MINUTE:-30}
    networks:
      - kealex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  svc-financeiro:
    build: ./svc-financeiro
    container_name: kealex-svc-financeiro
    environment:
      - KEALEX_SECRET_KEY=${KEALEX_SECRET_KEY}
      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}
    networks:
      - kealex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  svc-prazos:
    build: ./svc-prazos
    container_name: kealex-svc-prazos
    environment:
      - KEALEX_SECRET_KEY=${KEALEX_SECRET_KEY}
      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}
    networks:
      - kealex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  svc-usuarios:
    build: ./svc-usuarios
    container_name: kealex-svc-usuarios
    environment:
      - KEALEX_SECRET_KEY=${KEALEX_SECRET_KEY}
      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}
    networks:
      - kealex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  svc-configuracoes:
    build: ./svc-configuracoes
    container_name: kealex-svc-configuracoes
    environment:
      - KEALEX_SECRET_KEY=${KEALEX_SECRET_KEY}
      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}
    networks:
      - kealex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  svc-escritorios:
    build: ./svc-escritorios
    container_name: kealex-svc-escritorios
    environment:
      - KEALEX_SECRET_KEY=${KEALEX_SECRET_KEY}
      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}
    networks:
      - kealex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  svc-clientes:
    build: ./svc-clientes
    container_name: kealex-svc-clientes
    environment:
      - KEALEX_SECRET_KEY=${KEALEX_SECRET_KEY}
      - KEALEX_DB_HOST=${KEALEX_DB_HOST}
      - KEALEX_DB_PORT=${KEALEX_DB_PORT}
      - KEALEX_DB_NAME=${KEALEX_DB_NAME}
      - KEALEX_DB_USER=${KEALEX_DB_USER}
      - KEALEX_DB_PASSWORD=${KEALEX_DB_PASSWORD}
      - KEALEX_DATABASE_URL=${KEALEX_DATABASE_URL:-}
    networks:
      - kealex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
